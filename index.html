<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente de Arquetipos SGC</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f3f6fb;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

input[type="radio"]{display:none;}

.custom-radio{
cursor:pointer;
padding:0.4rem 1rem;
border-radius:9999px;
border:1px solid #ccc;
}

input[type="radio"]:checked + .custom-radio{
background:#0059D1;
color:white;
}
</style>
</head>

<body>

<div id="app" class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-3xl"></div>

<script>

const archetypes = [/* TU MISMO ARRAY SIN CAMBIOS */];

let currentStep = 0;
let userAnswers = {};
let isResultScreen = false;

const app = document.getElementById("app");

function renderInicio(){
app.innerHTML = `
<h1 class="text-3xl font-bold text-[#003776] mb-6">
Asistente de Clasificación de Arquetipos SGC
</h1>
<p class="mb-6">
Bienvenido. Esta herramienta le ayudará a identificar el arquetipo correcto para el servicio a contratar. Lea atentamente cada pregunta. Con una sola respuesta afirmativa ('Sí'), el arquetipo quedará definido. Proceda en el orden presentado.
</p>
<button onclick="start()" class="px-6 py-3 bg-[#0059D1] text-white rounded-full">
Comenzar
</button>
`;
}

function start(){ renderStep(); }

function renderStep(){
const step = archetypes[currentStep];
const answers = userAnswers[currentStep] || {};

let html = step.questions.map((q,i)=>`
<div class="mb-4">
<p>${q}</p>
<label>
<input type="radio" name="q${i}" value="yes" onchange="answer(${i},'yes')" ${answers[i]=='yes'?'checked':''}>
<span class="custom-radio">Sí</span>
</label>
<label>
<input type="radio" name="q${i}" value="no" onchange="answer(${i},'no')" ${answers[i]=='no'?'checked':''}>
<span class="custom-radio">No</span>
</label>
</div>
`).join("");

app.innerHTML = `
<h2 class="text-xl text-[#003776] mb-4">${step.title}</h2>
${html}

<div class="flex justify-between mt-6">
<button onclick="goBack()">Volver</button>
<button onclick="next()" class="bg-[#0059D1] text-white px-4 py-2 rounded">
Revisar y Continuar
</button>
</div>
`;
}

function answer(i,val){
if(!userAnswers[currentStep]) userAnswers[currentStep]={};
userAnswers[currentStep][i]=val;
}

function next(){

const answers = userAnswers[currentStep];
let found = null;

for(let i in answers){
if(answers[i]==='yes'){
found = archetypes[currentStep].questions[i];
break;
}
}

if(found){
isResultScreen = true;
renderResult(archetypes[currentStep].name, found);
return;
}

currentStep++;

if(currentStep >= archetypes.length){
isResultScreen = true;
renderNoResult();
}else{
renderStep();
}
}

function renderResult(name,question){
app.innerHTML = `
<h2 class="text-2xl font-bold text-[#0059D1] mb-4">¡Arquetipo Identificado!</h2>

<p><strong>Arquetipo:</strong> ${name}</p>
<p class="mb-4">Se identificó este arquetipo porque: "${question}"</p>

<p class="text-sm mb-6">
Nota Importante: Use esta herramienta como una guía. El resultado puede no ser 100% preciso o exhaustivo.
</p>

<button onclick="restart()" class="bg-[#0059D1] text-white px-4 py-2 rounded mr-2">
Volver a Empezar
</button>

<button onclick="goBack()">Volver</button>
`;
}

function renderNoResult(){
app.innerHTML = `
<h2 class="text-2xl text-red-600 mb-4">
Arquetipo no identificado automáticamente
</h2>

<p class="mb-6">
La ART definirá si corresponde Programa de Seguridad e Higiene.
</p>

<button onclick="restart()" class="bg-[#0059D1] text-white px-4 py-2 rounded mr-2">
Volver a Empezar
</button>

<button onclick="goBack()">Volver</button>
`;
}

function goBack(){

if(isResultScreen){
    isResultScreen = false;
    renderStep();
    return;
}

if(currentStep>0){
    currentStep--;
    renderStep();
}else{
    renderInicio();
}
}

function restart(){
currentStep = 0;
userAnswers = {};
isResultScreen = false;
renderInicio();
}

renderInicio();

</script>

</body>
</html>
